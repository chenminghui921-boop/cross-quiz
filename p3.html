<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>第三部分　土石方计算与调配</title>
<style>
:root{--ink:#18191C;--ink2:#61666D;--ink3:#9499A0;--line:#E9EBEE;--bg:#F5F6F8;--pink:#FB7299}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.68 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
header{background:#8B1D1D;color:#fff;padding:20px 0 18px}
.hin,.wrap{max-width:780px;margin:0 auto;padding:0 16px}
h1{margin:0 0 6px;font-size:20px}
.hsub{font-size:13px;color:rgba(255,255,255,.9)}
.wrap{padding-bottom:100px}
.note{background:#FFF7E6;border:1px solid #FFE0A3;color:#7a5200;border-radius:10px;
  padding:12px 14px;font-size:13.5px;margin:16px 0;line-height:1.75}
.sec{display:flex;align-items:center;gap:10px;margin:26px 0 6px;color:var(--ink2);font-size:13px}
.sec b{color:#8B1D1D;font-size:14px}
.sec i{flex:1;height:1px;background:var(--line);font-style:normal}
.q{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.qtop{display:flex;justify-content:space-between;color:var(--ink3);font-size:12.5px;margin-bottom:8px}
.qno{font-weight:700;color:#8B1D1D}
.qs{font-weight:600;line-height:1.68;margin-bottom:12px}
.blank-in{width:3.2em;border:0;border-bottom:1.5px solid #A9AEB5;background:transparent;
  font:inherit;font-weight:600;text-align:center;padding:0 2px;margin:0 3px;border-radius:0}
.blank-in:focus{outline:none;border-color:var(--pink);background:#FFF4F7}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;
  padding:11px 13px;margin:8px 0;cursor:pointer;background:#fff;font-size:14.5px;line-height:1.5}
.opt:hover{border-color:#D7DBE0}
.opt.on{border-color:#8B1D1D;background:#FBF3F2}
.opt .k{font-weight:700;color:var(--ink2);min-width:18px}
.opt.on .k{color:#8B1D1D}
textarea{width:100%;min-height:92px;border:1.5px solid var(--line);border-radius:10px;padding:11px;
  font:15px/1.65 inherit;resize:vertical;background:#FCFCFD;outline:none}
textarea:focus{border-color:var(--pink);background:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 16px;z-index:20}
.bar .in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .p{flex:1;font-size:13px;color:var(--ink2)}
.bar a{font-size:13px;color:var(--pink);text-decoration:none}
.prog{height:5px;background:#EDEFF2;border-radius:3px;overflow:hidden;margin-top:6px;
  max-width:780px;margin-left:auto;margin-right:auto}
.prog i{display:block;height:100%;background:#8B1D1D;transition:width .2s}
.foot{color:#9AA0AA;font-size:12px;text-align:center;margin-top:26px;line-height:1.9}
</style></head>
<body>
<header><div class="hin">
  <h1 id="ptitle">第三部分　土石方计算与调配</h1>
  <div class="hsub" id="pmeta"></div>
</div></header>
<div class="wrap">
  <div class="note">
    直接在本页作答：选择题点选，填空题在横线上输入，名词解释 / 问答 / 计算在题下文本框里写。
    <b>本页不显示答案</b>；作答内容只保存在这台设备上，刷新不会丢。
  </div>
  <div id="list"></div>
  <div class="foot">横断面设计 · 第三部分　土石方计算与调配</div>
</div>
<div class="bar"><div class="in">
  <div class="p" id="pcount"></div>
  <a href="#" id="clear">清空本部分</a>
</div></div>
<div class="prog"><i id="pfill" style="width:0"></i></div>
<script>
const DATA = {"id": 3, "title": "第三部分　土石方计算与调配", "pages": "104–111", "qs": [{"t": "fill", "type": "填空", "s": "横断面面积计算常用的两种方法是____和____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "积距法的总面积公式为 A=____，其中 b 表示____，hi 表示____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "坐标法的面积公式为 A=____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "当相邻两断面均为填方或均为挖方且面积大小相近时，可假定两断面之间为____，其体积公式为 V=____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "当相邻两断面面积相差较大时，两断面之间更接近____，其体积公式为 V=____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "土石方调配的目的是确定____的来源、____的去向，以及计价土石方的数量和运量。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "土石方调配的第一条原则是：半填半挖断面中，先____平衡，再____调配。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "纵向调运的距离应小于____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "经济运距的计算公式为 Lj=____，其中 B 表示____，T 表示____，Lm 表示____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "一般人工运输的免费运距为____米，汽车运输的免费运距为____公里。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "土石方调配中，填方＝本桩利用＋____＝横向调运＋纵向调运＋____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "挖方＝本桩利用＋____＝横向调运＋纵向调运＋____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "挖方＋借方＝____＋弃方。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "计价土石方＝____＋____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "所有挖方计价，填方中的路外借土要计价，____不重复计价。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "定额中“天然密实土”是指____，“夯实土”是指____，“松填土”是指____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "土方松实系数换算表中，自然方为 1，松方为____，实方为____。", "p": 104, "sec": "填空"}, {"t": "fill", "type": "填空", "s": "生产上多采用____调配法进行土石方调配。", "p": 104, "sec": "填空"}, {"t": "mc", "type": "选择", "s": "横断面面积计算中，积距法的总面积公式为（ ）。", "p": 105, "sec": "选择", "o": ["A=bΣhi", "A=1/2Σ(xi·yi+1－xi-1·yi)", "A=1/2(F1+F2)L", "A=1/3(F1+F2)L"]}, {"t": "mc", "type": "选择", "s": "当相邻两断面面积相差较大时，土石方体积计算应采用（ ）。", "p": 105, "sec": "选择", "o": ["平均断面法", "棱台公式", "积距法", "坐标法"]}, {"t": "mc", "type": "选择", "s": "经济运距的计算公式 Lj=B/T+Lm 中，B 表示（ ）。", "p": 105, "sec": "选择", "o": ["远运运费单价", "借土单价", "免费运距", "调配方数"]}, {"t": "mc", "type": "选择", "s": "一般汽车运输的免费运距为（ ）。", "p": 105, "sec": "选择", "o": ["20 米", "100 米", "1 公里", "5 公里"]}, {"t": "mc", "type": "选择", "s": "以下哪个等式是正确的？", "p": 105, "sec": "选择", "o": ["填方＝本桩利用＋挖余", "挖方＝本桩利用＋填缺", "挖方＋借方＝填方＋弃方", "计价土石方＝填方＋借方"]}, {"t": "mc", "type": "选择", "s": "关于计价土石方，以下说法正确的是（ ）。", "p": 106, "sec": "选择", "o": ["计价土石方＝挖方数量＋填方数量", "移挖作填的土方需要重复计价", "计价土石方＝挖方数量＋借方数量", "所有填方都需要计价"]}, {"t": "mc", "type": "选择", "s": "土方松实系数换算表中，自然方为 1，松方为（ ）。", "p": 106, "sec": "选择", "o": ["0.85", "1.33", "1.53", "1.07"]}, {"t": "mc", "type": "选择", "s": "土石方调配时，首先应考虑的是（ ）。", "p": 106, "sec": "选择", "o": ["纵向调运", "横向平衡", "借方", "弃方"]}, {"t": "mc", "type": "选择", "s": "以下哪种情况应优先考虑上下线的土方竖向调运？", "p": 106, "sec": "选择", "o": ["直线路段", "回头曲线路段", "桥梁路段", "隧道路段"]}, {"t": "mc", "type": "选择", "s": "土石方计算表调配法中，复核检查的等式不包括（ ）。", "p": 106, "sec": "选择", "o": ["填方＝本桩利用＋填缺", "挖方＝本桩利用＋挖余", "挖方＋借方＝填方＋弃方", "填方＝借方＋弃方"]}, {"t": "tf", "type": "判断", "s": "积距法适合用计算机程序计算，坐标法适合手工计算。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "平均断面法适用于相邻两断面面积相差较大的情况。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "经济运距是指按费用计算的纵向调运的最大限度。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "免费运距是指在这个距离之内运输不额外计费。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "土石方调配时，应先纵向调配，再横向平衡。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "计价土石方等于挖方数量加借方数量。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "移挖作填的土方需要重复计价。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "天然密实土的体积大于夯实土的体积。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "1 立方米天然密实土挖松后变成 1.33 立方米松方。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "tf", "type": "判断", "s": "石方和土方可以混合调配，不需要分开。", "p": 107, "sec": "判断", "o": ["对", "错"]}, {"t": "term", "type": "名词解释", "s": "经济运距", "p": 108, "sec": "名词解释"}, {"t": "term", "type": "名词解释", "s": "免费运距", "p": 108, "sec": "名词解释"}, {"t": "term", "type": "名词解释", "s": "本桩利用", "p": 108, "sec": "名词解释"}, {"t": "term", "type": "名词解释", "s": "填缺", "p": 108, "sec": "名词解释"}, {"t": "term", "type": "名词解释", "s": "挖余", "p": 108, "sec": "名词解释"}, {"t": "term", "type": "名词解释", "s": "计价土石方", "p": 108, "sec": "名词解释"}, {"t": "term", "type": "名词解释", "s": "天然密实土", "p": 108, "sec": "名词解释"}, {"t": "term", "type": "名词解释", "s": "夯实土", "p": 108, "sec": "名词解释"}, {"t": "term", "type": "名词解释", "s": "松填土", "p": 108, "sec": "名词解释"}, {"t": "calc", "type": "计算", "s": "题目一：某公路路基施工中，有一段填方路堤需要填筑。已知填方压实后的体积（实方）为 8000 m³，采用土方填筑，从取土场挖取天然密实土（自然方）来填筑。（土方松实系数：自然方 1，松方 1.33，实方 0.85）\n（1）需要从取土场挖取多少自然方的土？\n（2）挖出来的土堆放在路边，松方体积是多少？\n（3）如果利用路段本身挖方产生的天然密实土来填筑，请分析整个过程中体积是如何变化的。", "p": 109, "sec": "计算"}, {"t": "calc", "type": "计算", "s": "题目二：某路段相邻两个断面的挖方面积分别为 F1=50 m² 和 F2=60 m²，两断面之间的距离 L=20 m。\n（1）用平均断面法计算两断面之间的土方体积。\n（2）如果 F1=30 m²、F2=90 m²，面积相差较大，用棱台公式计算体积。（m=F1/F2，F2>F1）", "p": 110, "sec": "计算"}, {"t": "qa", "type": "问答", "s": "简述横断面面积计算的两种方法，并说明各自的优缺点和适用场景。", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "简述土石方数量计算中平均断面法和棱台公式的适用条件。", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "土石方调配的目的是什么？调配应遵循哪些原则？", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "什么是经济运距？如何计算？它在土石方调配中有什么意义？", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "土石方计算表调配法分哪几个步骤？请简要说明每个步骤的内容。", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "复核检查土石方调配时，有哪三个等式必须成立？请写出来并解释其含义。", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "什么是计价土石方？为什么移挖作填不重复计价？", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "简述土方松实系数换算表中自然方、松方、实方三者之间的关系，并说明为什么算土方量时必须考虑松实系数换算。", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "土石方调配时，为什么要考虑桥涵位置和路线纵坡的影响？为什么要尽量少占农田？", "p": 111, "sec": "问答"}, {"t": "qa", "type": "问答", "s": "请结合实例说明土石方计算表调配法的应用过程。", "p": 111, "sec": "问答"}]};
const KEY = 'hz_paper_' + DATA.id;
let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { st = {}; }
const save = () => localStorage.setItem(KEY, JSON.stringify(st));
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

document.getElementById('ptitle').textContent = DATA.title;
document.getElementById('pmeta').textContent =
  '共 ' + DATA.qs.length + ' 题 · 课件第 ' + DATA.pages + ' 页 · 直接在本页作答';

let html = '', lastSec = '';
DATA.qs.forEach((q, i) => {
  if (q.sec !== lastSec) {
    lastSec = q.sec;
    html += '<div class="sec"><b>' + esc(q.sec) + '</b><i></i></div>';
  }
  html += '<section class="q"><div class="qtop"><span class="qno">' + (i + 1) + '</span>'
    + '<span>' + q.type + ' · 课件 P' + q.p + '</span></div>';

  if (q.t === 'fill') {
    const segs = q.s.split(/_{2,}/);
    const n = segs.length - 1;
    const vals = (st['f' + i] && st['f' + i].length === n) ? st['f' + i] : new Array(n).fill('');
    let line = '<div class="qs">';
    segs.forEach((seg, k) => {
      line += esc(seg);
      if (k < n) {
        const w = 7;
        line += '<input class="blank-in" data-q="' + i + '" data-b="' + k
          + '" style="width:' + w + 'em" value="' + esc(vals[k] || '') + '">';
      }
    });
    html += line + '</div>';
  } else {
    html += '<div class="qs">' + esc(q.s) + '</div>';
    if (q.t === 'mc' || q.t === 'tf') {
      const picked = st['c' + i];
      html += q.o.map((t, k) => {
        const key = q.t === 'tf' ? (k === 0 ? '√' : '×') : 'ABCD'[k];
        return '<div class="opt' + (picked === k ? ' on' : '') + '" data-q="' + i + '" data-k="' + k + '">'
          + '<span class="k">' + key + '</span><span>' + esc(t) + '</span></div>';
      }).join('');
    } else {
      const v = (st['t' + i] || '');
      html += '<textarea data-q="' + i + '" placeholder="在这里作答">' + esc(v) + '</textarea>';
    }
  }
  html += '</section>';
});
document.getElementById('list').innerHTML = html;

function progress() {
  let done = 0;
  DATA.qs.forEach((q, i) => {
    if (q.t === 'mc' || q.t === 'tf') { if (st['c' + i] !== undefined) done++; }
    else if (q.t === 'fill') {
      const v = st['f' + i] || [];
      if (v.length && v.every(x => String(x).trim() !== '')) done++;
    } else if (String(st['t' + i] || '').trim() !== '') done++;
  });
  document.getElementById('pcount').textContent = '已作答 ' + done + ' / ' + DATA.qs.length;
  document.getElementById('pfill').style.width = Math.round(done / DATA.qs.length * 100) + '%';
}

document.querySelectorAll('.opt').forEach(el => {
  el.onclick = () => {
    const i = Number(el.dataset.q);
    st['c' + i] = Number(el.dataset.k);
    save();
    document.querySelectorAll('.opt[data-q="' + i + '"]').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    progress();
  };
});

document.querySelectorAll('input.blank-in').forEach(inp => {
  inp.oninput = () => {
    const i = Number(inp.dataset.q);
    const all = document.querySelectorAll('input.blank-in[data-q="' + i + '"]');
    st['f' + i] = [].map.call(all, x => x.value);
    save(); progress();
  };
});

document.querySelectorAll('textarea[data-q]').forEach(ta => {
  ta.oninput = () => {
    st['t' + Number(ta.dataset.q)] = ta.value;
    save(); progress();
  };
});

document.getElementById('clear').onclick = () => {
  if (!confirm('清空本部分的作答？')) return;
  st = {}; save();
  document.querySelectorAll('.opt').forEach(x => x.classList.remove('on'));
  document.querySelectorAll('input.blank-in').forEach(x => { x.value = ''; });
  document.querySelectorAll('textarea[data-q]').forEach(x => { x.value = ''; });
  progress();
};

progress();
</script>
</body></html>
