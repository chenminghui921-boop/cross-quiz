<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FB7299">
<title>横断面设计 · 测试</title>
<style>
:root{--pink:#FB7299;--ink:#18191C;--ink2:#61666D;--ink3:#9499A0;--line:#E9EBEE;--bg:#F5F6F8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.65 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
header{background:var(--pink);color:#fff;padding:20px 0 18px}
.hin{max-width:760px;margin:0 auto;padding:0 16px}
h1{margin:0 0 6px;font-size:20px}
.hsub{font-size:13px;color:rgba(255,255,255,.9)}
.idbar{display:flex;gap:10px;align-items:center;background:#fff;border-radius:12px;
  padding:12px 14px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.idbar label{font-size:14px;color:var(--ink2);white-space:nowrap}
.idbar input{flex:1;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;
  font-size:15px;outline:none}
.idbar input:focus{border-color:var(--pink)}
.note{background:#FFF7E6;border:1px solid #FFE0A3;color:#8a5a00;border-radius:10px;
  padding:12px 14px;font-size:13.5px;margin:0 0 16px;line-height:1.7}
.q{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.qtop{display:flex;justify-content:space-between;color:var(--ink3);font-size:12.5px;margin-bottom:8px}
.qno{font-weight:700;color:var(--pink)}
.qs{font-weight:600;line-height:1.6;white-space:pre-wrap;margin-bottom:12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;
  padding:11px 13px;margin:8px 0;cursor:pointer;background:#fff;font-size:14.5px;line-height:1.5}
.opt:hover{border-color:#D7DBE0}
.opt.on{border-color:var(--pink);background:#FFF4F7}
.opt .k{font-weight:700;color:var(--ink2);min-width:18px}
.opt.on .k{color:var(--pink)}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:12px;z-index:20}
.bar .p{flex:1;font-size:13px;color:var(--ink2)}
.btn{border:0;border-radius:10px;background:var(--pink);color:#fff;font-size:15px;
  font-weight:600;padding:11px 20px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.ghost{background:#fff;color:var(--pink);border:1.5px solid var(--pink)}
.done{background:#fff;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.code{font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#F7F7F9;border:1px dashed #C9CCD1;
  border-radius:10px;padding:12px;word-break:break-all;margin:10px 0;user-select:all}
.ok{color:#2BA471}
.foot{color:#9AA0AA;font-size:12px;text-align:center;margin-top:26px;line-height:1.9}
</style></head>
<body>
<header><div class="hin">
  <h1 id="ptitle">加载中…</h1>
  <div class="hsub" id="pmeta"></div>
</div></header>
<div class="wrap">
  <div class="idbar">
    <label>学号</label>
    <input id="sid" placeholder="填学号（数字或字母，3–20 位）" autocomplete="off">
  </div>
  <div class="note" id="notice">
    本题库只考<b>选择与判断</b>；填空、名词解释、问答、计算请写在纸上。
    交卷后会出现一行<b>递交码</b>，复制发给老师即可，页面不显示答案。
  </div>
  <div id="done" class="done" style="display:none"></div>
  <div id="list"></div>
  <div class="foot">横断面设计 · 第四章 · 客观题测试</div>
</div>
<div class="bar">
  <div class="p" id="pcount"></div>
  <button class="btn" id="submit">交卷</button>
</div>
<script>
const PART = parseInt(new URLSearchParams(location.search).get('p') || '1', 10);
const DATA = {"parts": [{"id": 1, "title": "第一部分　横断面组成、车道与路肩", "pages": "45–51", "qs": [{"t": "tf", "s": "公路路基宽度就是车道宽度与路肩宽度之和，不包含中间带宽度。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "分离式断面和整体式断面都属于双幅公路的范畴。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "城市道路中，四幅路的安全性最高，但占地最宽、造价最高。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "公路和城市道路的本质区别在于服务对象不同，公路服务“车”，城市道路服务“人”。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "硬路肩可以作为超车道使用，以提高通行效率。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "左侧硬路肩宽度不包含左侧路缘带宽度。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "路拱横坡坡度越大，对行车越有利。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "折线型路拱适用于沥青混凝土路面。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "中间带由中央分隔带和两条右侧路缘带组成。", "o": ["对", "错"], "p": 46}, {"t": "tf", "s": "城市道路的两侧分车带用于分隔机动车和非机动车。", "o": ["对", "错"], "p": 46}, {"t": "mc", "s": "以下哪种路幅布置类型适用于高速公路和一级公路？", "o": ["单幅单车道", "单幅双车道", "双幅多车道", "单幅多车道"], "p": 47}, {"t": "mc", "s": "城市道路中，旧称“三块板”的是哪种布置类型？", "o": ["单幅路", "双幅路", "三幅路", "四幅路"], "p": 47}, {"t": "mc", "s": "设计速度为 120 km/h 时，公路车道宽度一般取多少米？", "o": ["3.00", "3.25", "3.50", "3.75"], "p": 47}, {"t": "mc", "s": "高速公路右侧硬路肩宽度小于多少米时，应设置紧急停车带？", "o": ["2.00", "2.50", "3.00", "3.50"], "p": 47}, {"t": "mc", "s": "以下哪种路面类型对应的路拱横坡度最小？", "o": ["水泥混凝土路面", "碎石路面", "低级路面", "半整齐石块路面"], "p": 47}, {"t": "mc", "s": "中间带的组成部分包括（ ）。", "o": ["中央分隔带", "左侧路缘带", "右侧路缘带", "A 和 B"], "p": 48}, {"t": "mc", "s": "关于硬路肩的作用，以下说法错误的是（ ）。", "o": ["供临时停车", "作为超车道使用", "提供侧向余宽", "为养护提供场地"], "p": 48}, {"t": "mc", "s": "路拱横坡度的确定与以下哪个因素无关？", "o": ["路面结构类型", "车道宽度", "自然条件", "设计车辆颜色"], "p": 48}]}, {"id": 2, "title": "第二部分　平曲线加宽与超高", "pages": "90–95", "qs": [{"t": "mc", "s": "汽车在曲线上行驶时，轨迹半径最小的车轮是（ ）。", "o": ["左前轮", "右前轮", "左后轮", "右后轮内侧"], "p": 91}, {"t": "mc", "s": "当圆曲线半径满足以下哪个条件时，需要加宽？", "o": ["R≤500m", "R≤250m", "R≤100m", "R≤50m"], "p": 91}, {"t": "mc", "s": "二、三、四级公路的加宽过渡方式一般采用（ ）。", "o": ["高次抛物线过渡", "回旋线过渡", "比例过渡", "圆曲线过渡"], "p": 91}, {"t": "mc", "s": "超高的作用是（ ）。", "o": ["增加路面宽度", "全部或部分抵消离心力，提高行车稳定性和舒适性", "利于横向排水", "保护路面结构"], "p": 91}, {"t": "mc", "s": "超高值的计算公式 ih=V²/(127R)－μ 中，μ 表示（ ）。", "o": ["设计速度", "圆曲线半径", "横向力系数", "超高横坡度"], "p": 91}, {"t": "mc", "s": "有中间带道路的超高过渡中，绕各自车道中线旋转适用于车道数大于（ ）条的公路。", "o": ["2", "3", "4", "6"], "p": 92}, {"t": "mc", "s": "无中间带道路的超高过渡中，新建公路适用于（ ）。", "o": ["绕路面内侧边缘旋转", "绕路面中心线旋转", "绕路面外侧边缘旋转", "绕路肩边缘旋转"], "p": 92}, {"t": "mc", "s": "超高缓和段长度的计算公式 lmin=B·Δi/P 中，P 表示（ ）。", "o": ["旋转轴至车行道外侧边缘的宽度", "超高坡度与路拱坡度的代数差", "超高渐变率", "圆曲线半径"], "p": 92}, {"t": "mc", "s": "按照公式计算的超高缓和段，应凑成（ ）的整倍数。", "o": ["2 米", "5 米", "10 米", "20 米"], "p": 92}, {"t": "mc", "s": "超高允许最小渐变率为（ ）。", "o": ["1/100", "1/200", "1/330", "1/500"], "p": 92}, {"t": "tf", "s": "汽车在曲线上行驶时，前轮轨迹半径最小，所以曲线内侧应增加路面宽度。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "各级公路的路面加宽以后，路基宽度不需要相应加宽。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "当圆曲线半径大于 250 米时，加宽计算值甚小，可不加宽。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "四级公路可以不设缓和曲线，但圆曲线上有加宽时，应设加宽过渡段。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "高次抛物线过渡和回旋线过渡在实际工程中广泛采用。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "超高计算值小于路拱横坡时，应取路拱横坡值。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "有中间带道路的超高过渡中，绕中间带的中心线旋转适用于各种宽度中间带的公路。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "无中间带道路的超高过渡中，新建公路适用于绕路面中心线旋转。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "超高缓和段长度计算出来后，应凑成 5 米的整倍数，并不小于 10 米。", "o": ["对", "错"], "p": 93}, {"t": "tf", "s": "设计速度越高，允许的最大渐变率越大。", "o": ["对", "错"], "p": 93}]}, {"id": 3, "title": "第三部分　土石方计算与调配", "pages": "104–111", "qs": [{"t": "mc", "s": "横断面面积计算中，积距法的总面积公式为（ ）。", "o": ["A=bΣhi", "A=1/2Σ(xi·yi+1－xi-1·yi)", "A=1/2(F1+F2)L", "A=1/3(F1+F2)L"], "p": 105}, {"t": "mc", "s": "当相邻两断面面积相差较大时，土石方体积计算应采用（ ）。", "o": ["平均断面法", "棱台公式", "积距法", "坐标法"], "p": 105}, {"t": "mc", "s": "经济运距的计算公式 Lj=B/T+Lm 中，B 表示（ ）。", "o": ["远运运费单价", "借土单价", "免费运距", "调配方数"], "p": 105}, {"t": "mc", "s": "一般汽车运输的免费运距为（ ）。", "o": ["20 米", "100 米", "1 公里", "5 公里"], "p": 105}, {"t": "mc", "s": "以下哪个等式是正确的？", "o": ["填方＝本桩利用＋挖余", "挖方＝本桩利用＋填缺", "挖方＋借方＝填方＋弃方", "计价土石方＝填方＋借方"], "p": 105}, {"t": "mc", "s": "关于计价土石方，以下说法正确的是（ ）。", "o": ["计价土石方＝挖方数量＋填方数量", "移挖作填的土方需要重复计价", "计价土石方＝挖方数量＋借方数量", "所有填方都需要计价"], "p": 106}, {"t": "mc", "s": "土方松实系数换算表中，自然方为 1，松方为（ ）。", "o": ["0.85", "1.33", "1.53", "1.07"], "p": 106}, {"t": "mc", "s": "土石方调配时，首先应考虑的是（ ）。", "o": ["纵向调运", "横向平衡", "借方", "弃方"], "p": 106}, {"t": "mc", "s": "以下哪种情况应优先考虑上下线的土方竖向调运？", "o": ["直线路段", "回头曲线路段", "桥梁路段", "隧道路段"], "p": 106}, {"t": "mc", "s": "土石方计算表调配法中，复核检查的等式不包括（ ）。", "o": ["填方＝本桩利用＋填缺", "挖方＝本桩利用＋挖余", "挖方＋借方＝填方＋弃方", "填方＝借方＋弃方"], "p": 106}, {"t": "tf", "s": "积距法适合用计算机程序计算，坐标法适合手工计算。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "平均断面法适用于相邻两断面面积相差较大的情况。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "经济运距是指按费用计算的纵向调运的最大限度。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "免费运距是指在这个距离之内运输不额外计费。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "土石方调配时，应先纵向调配，再横向平衡。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "计价土石方等于挖方数量加借方数量。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "移挖作填的土方需要重复计价。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "天然密实土的体积大于夯实土的体积。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "1 立方米天然密实土挖松后变成 1.33 立方米松方。", "o": ["对", "错"], "p": 107}, {"t": "tf", "s": "石方和土方可以混合调配，不需要分开。", "o": ["对", "错"], "p": 107}]}]};
const P = DATA.parts[PART - 1];
const KEYSTORE = 'hz_exam_' + PART;
let answers = new Array(P.qs.length).fill(-1);
let submitted = false;
let startedAt = Date.now();

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const b64e = s => btoa(unescape(encodeURIComponent(s)))
  .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  return decodeURIComponent(escape(atob(s)));
};

document.getElementById('ptitle').textContent = P.title;
document.getElementById('pmeta').textContent =
  '共 ' + P.qs.length + ' 题（选择＋判断）· 课件第 ' + P.pages + ' 页';

function render() {
  const box = document.getElementById('list');
  box.innerHTML = P.qs.map((q, i) => {
    const opts = q.o.map((t, k) => {
      const key = q.t === 'tf' ? (k === 0 ? '√' : '×') : 'ABCD'[k];
      const on = answers[i] === k ? ' on' : '';
      return '<div class="opt' + on + '" data-q="' + i + '" data-k="' + k + '">'
        + '<span class="k">' + key + '</span><span>' + esc(t) + '</span></div>';
    }).join('');
    return '<section class="q"><div class="qtop"><span class="qno">第 ' + (i + 1) + ' 题</span>'
      + '<span>' + (q.t === 'tf' ? '判断' : '选择') + ' · 课件 P' + q.p + '</span></div>'
      + '<div class="qs">' + esc(q.s) + '</div>' + opts + '</section>';
  }).join('');
  box.querySelectorAll('.opt').forEach(el => {
    el.onclick = () => {
      if (submitted) return;
      answers[Number(el.dataset.q)] = Number(el.dataset.k);
      render();
      updateBar();
    };
  });
  if (submitted) {
    box.querySelectorAll('.opt').forEach(el => { el.style.pointerEvents = 'none'; el.style.opacity = '0.72'; });
  }
}

function updateBar() {
  const done = answers.filter(a => a >= 0).length;
  document.getElementById('pcount').textContent =
    submitted ? '已交卷，把下面的递交码发给老师' : '已答 ' + done + ' / ' + answers.length;
  const btn = document.getElementById('submit');
  btn.disabled = submitted;
  btn.textContent = submitted ? '已交卷' : (done < answers.length ? '交卷（还有 ' + (answers.length - done) + ' 题未答）' : '交卷');
}

function submit() {
  const sid = (document.getElementById('sid').value || '').trim().replace(/\s+/g, '');
  if (!sid) { alert('请先填学号'); document.getElementById('sid').focus(); return; }
  if (!/^[0-9A-Za-z_-]{3,20}$/.test(sid)) { alert('学号只填数字或字母，3–20 位'); return; }
  const blank = answers.filter(a => a < 0).length;
  if (blank && !confirm('还有 ' + blank + ' 题没答，确定交卷？')) return;

  submitted = true;
  const sec = Math.round((Date.now() - startedAt) / 1000);
  const ans = answers.map(a => (a < 0 ? 'x' : String(a))).join('');
  const code = b64e([sid, PART, sec, ans].join('|'));

  const done = document.getElementById('done');
  done.style.display = 'block';
  done.innerHTML = '<h3 style="margin:0 0 8px">已交卷</h3>'
    + '<div style="color:#61666D;font-size:14px">学号 <b>' + esc(sid) + '</b> · 第' + PART + '部分 · 用时 '
    + Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒 · 作答 ' + (answers.length - blank) + '/' + answers.length + '</div>'
    + '<div class="code" id="code">' + code + '</div>'
    + '<button class="btn" id="copy">复制递交码</button>'
    + '<div style="color:#9499A0;font-size:12.5px;margin-top:10px">把这一行发给老师（微信、QQ 都行），老师粘贴后自动统计。</div>';

  document.getElementById('copy').onclick = () => {
    const t = code;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('已复制'), () => alert('请长按上面的码手动复制'));
    else alert('请长按上面的码手动复制');
  };
  localStorage.setItem(KEYSTORE, JSON.stringify({ sid: sid, code: code }));
  updateBar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('submit').onclick = submit;

// 支持 ?p= 缺省；补上说明
render();
updateBar();
</script>
</body></html>
